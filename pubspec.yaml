name: lango
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  go_router: ^18.0.1
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so Latin, Hangul and Kana render identically on every platform
  # (REDESIGN.md §7). Subset from Google Fonts variable sources and
  # instantiated to static weights so `FontWeight` works without
  # `fontVariations` at every call site. See REFERENCE_ANALYSIS.md §2.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-700.ttf
          weight: 700
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-700.ttf
          weight: 700
